name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: python verify.py
      - run: python -m compileall -q src tests verify.py
      - run: python -m ali1688_uploader.cli validate data/example_products.jsonl

      - name: Unit tests
        run: pytest -q
